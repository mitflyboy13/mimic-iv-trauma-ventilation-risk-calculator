[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vent-trauma-tool"
version = "0.1.0"
description = "MIMIC-IV trauma ICU ventilator liberation prediction workflow"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
test = ["pytest>=7.0"]

[project.scripts]
vent-trauma = "vent_trauma_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
