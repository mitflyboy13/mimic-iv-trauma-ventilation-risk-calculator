services:
  - type: web
    name: mimic-iv-trauma-ventilation-risk-calculator
    runtime: docker
    repo: https://github.com/mitflyboy13/mimic-iv-trauma-ventilation-risk-calculator
    branch: main
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ready
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_HEURISTIC_FALLBACK
        value: "0"
      - key: MIMIC_AUTH_MODE
        value: restricted
      - key: PUBLIC_ORIGIN
        sync: false
      - key: MIMIC_BOOTSTRAP_USERNAME
        sync: false
      - key: MIMIC_BOOTSTRAP_PASSWORD
        sync: false
