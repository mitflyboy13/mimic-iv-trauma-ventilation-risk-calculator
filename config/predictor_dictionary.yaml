study_and_cohort_identity:
  mimic_mapping:
    citation: "Cite MIMIC-IV, MIT-LCP mimic-code when concepts are rebuilt, and the PhysioNet Temporal Respiratory Support dataset v1.1.0 when ICU ventilatory time-series data are used."
    country: "United States"
    recruitment_years: "MIMIC-IV contains BIDMC hospital/ICU encounters from 2008-2019; Temporal Respiratory Support is a MIMIC-IV v2.2 derivative spanning 90 days after ICU admission."
    design: "Retrospective cohort"
    trauma_subtype: "ICD diagnosis derived: TBI, spine, thoracic, abdominal/pelvic, extremity, burn, polytrauma proxy."
    setting: "Single centre, Beth Israel Deaconess Medical Center"
    cohort_role: "Model-development/internal-validation split by patient."
    preferred_ventilatory_dataset: "A Temporal Dataset for Respiratory Support in Critically Ill Patients v1.1.0, https://physionet.org/content/temporal-respiratory-support/1.1.0/"
participants:
  extractable_features:
    - age
    - sex
    - race
    - admission_type
    - first_careunit
    - hospital_los_days
    - icu_los_days
    - oasis
    - apsiii
    - sofa_before_liberation
    - charlson_comorbidity_index
    - gcs_min_24h
    - max_ais
    - iss_proxy
    - injury_body_region_count
  unavailable_structured:
    - native ISS without external trauma-registry linkage
    - native AIS by body region without external trauma-registry linkage
ventilator_liberation_outcome:
  default_definition: "No invasive ventilation reinstitution and no death within 48 hours after first qualifying invasive ventilation episode end."
  event_column: "liberation_success_48h"
  denominator_column: "eligible_liberation_attempt"
timing_and_clinical_decision_context:
  time_origin: "End time of first invasive ventilation episode, used as apparent liberation/extubation time."
  prediction_horizon: "48 hours"
  measurement_windows:
    - "24 hours before time origin"
    - "6 hours before time origin for final ventilator/ABG/SBT-proxy values"
clinical_and_injury_predictors:
  extractable_features:
    - head_neck_ais
    - spine_ais
    - chest_ais
    - abdomen_pelvis_ais
    - extremity_ais
    - external_burn_ais
    - max_ais
    - severe_ais_region_count
    - iss_proxy
    - polytrauma_proxy
    - vasopressor_any_24h
    - norepinephrine_equivalent_max_24h
    - suspected_infection_flag
    - antibiotic_any_24h
    - sedative_proxy_any_24h
    - opioid_proxy_any_24h
  unavailable_structured:
    - secretion burden
    - cough strength
arterial_blood_gas_and_oxygenation_predictors:
  extractable_features:
    - ph_last_6h
    - pao2_last_6h
    - paco2_last_6h
    - bicarbonate_last_6h
    - lactate_max_24h
    - pao2fio2_last_6h
    - fio2_last_6h
    - spo2_min_24h
ventilator_and_respiratory_mechanics_predictors:
  preferred_source: "Temporal Respiratory Support hourly CSV/table when available; MIT-LCP mimic-code ventilator_setting concept otherwise."
  extractable_features:
    - peep_last_6h
    - pressure_support_last_6h
    - tidal_volume_observed_last_6h
    - respiratory_rate_set_last_6h
    - respiratory_rate_total_max_24h
    - plateau_pressure_last_6h
    - compliance_proxy_last_6h
    - driving_pressure_proxy_last_6h
    - rsbi_proxy_last_6h
sat_and_sbt_variables:
  extractable_or_proxy_features:
    - sbt_mode_proxy
    - low_support_proxy
    - final_6h_pressure_support
    - final_6h_peep
  unavailable_structured:
    - formal SAT protocol
    - formal SBT pass/fail criteria
    - SBT duration
other_respiratory_assessments:
  unavailable_structured:
    - diaphragm ultrasound
    - airway patency test
    - neurologic respiratory drive assessment
    - cuff leak test
